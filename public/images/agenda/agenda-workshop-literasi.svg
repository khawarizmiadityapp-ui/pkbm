<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Poster Workshop Literasi Digital Perpustakaan PKBM INTAN">
  <defs>
    <linearGradient id="workshop-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102F4D"/>
      <stop offset="100%" stop-color="#091E32"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#workshop-bg)"/>
  <rect x="40" y="38" width="194" height="34" rx="17" fill="#E9A820"/>
