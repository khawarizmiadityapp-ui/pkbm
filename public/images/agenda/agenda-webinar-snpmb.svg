    <text x="134" y="40" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="600">Seleksi Nasional Berdasarkan Prestasi</text>

    <rect y="86" width="560" height="68" rx="12" fill="#102F4D" stroke="#2D5A87" stroke-width="1.5"/>
