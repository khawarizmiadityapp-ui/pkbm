<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Poster Siap TKA 2026 Tes Kemampuan Akademik Paket C PKBM Intan">
  <rect width="800" height="520" fill="#324052"/>

  <!-- Subtle diagonal highlight -->
  <path d="M0 0 L480 0 L280 520 L0 520 Z" fill="#FFFFFF" fill-opacity="0.02"/>

  <!-- Top-right large warm gold circle -->
  <circle cx="725" cy="70" r="148" fill="#E6A826"/>

  <!-- Top-left label -->
  <text x="48" y="48" fill="#CBD5E1" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.4">PENGUMUMAN &#8226; PAKET C</text>

  <!-- Top-right white brand pill -->
  <rect x="612" y="28" width="144" height="32" rx="16" fill="#FFFFFF"/>
  <circle cx="634" cy="44" r="9" fill="#E0F2FE"/>
  <path d="M634 38.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm-1.8 7.5-.7 4.2 2.5-1.3 2.5 1.3-.7-4.2" fill="#0284C7"/>
  <text x="698" y="48.5" text-anchor="middle" fill="#0F2537" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.4">PKBM INTAN</text>

  <!-- Gold circular 4 HARI UJIAN stamp -->
  <g transform="translate(658 212)">
    <circle cx="0" cy="0" r="56" fill="#EAB32E"/>
    <circle cx="0" cy="0" r="49" fill="none" stroke="#9A6B11" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0F2537" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="900">4</text>
    <text x="0" y="16" text-anchor="middle" fill="#0F2537" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.5">HARI UJIAN</text>
  </g>

  <!-- Main Headline -->
  <text x="48" y="156" fill="#FFFFFF" font-family="Segoe UI, system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="0.5">SIAP</text>
  <text x="48" y="208" fill="#F5BA28" font-family="Segoe UI, system-ui, sans-serif" font-size="46" font-weight="900" letter-spacing="0.5">TKA 2026!</text>

  <!-- Subtitle -->
  <text x="48" y="242" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="500">Tes Kemampuan Akademik</text>
  <text x="48" y="264" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="500">untuk <tspan font-weight="700" fill="#FFFFFF">Warga Belajar Paket C</tspan></text>
  <text x="48" y="286" fill="#E2E8F0" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="500">PKBM INTAN.</text>

  <!-- Bottom White Schedule Card -->
  <rect x="44" y="344" width="712" height="148" rx="14" fill="#FFFFFF"/>

  <text x="68" y="376" fill="#0F2537" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="800">Catat tanggalnya!</text>

  <!-- Hourglass icon top-right of white card -->
  <g transform="translate(722 362)" fill="none" stroke="#E6A826" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 1h10M2 15h10M3.5 1v3.5c0 1.8 3.5 3 3.5 3.5s-3.5 1.7-3.5 3.5V15M10.5 1v3.5c0 1.8-3.5 3-3.5 3.5s3.5 1.7 3.5 3.5V15"/>
  </g>

  <!-- Row 1: Date -->
  <g transform="translate(68 394)">
    <rect x="0" y="1" width="14" height="14" rx="2.5" fill="none" stroke="#E6A826" stroke-width="1.6"/>
    <line x1="4" y1="-1" x2="4" y2="3" stroke="#E6A826" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="10" y1="-1" x2="10" y2="3" stroke="#E6A826" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="14" y2="6" stroke="#E6A826" stroke-width="1.4"/>
    <text x="26" y="12.5" fill="#0F2537" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">31 Okt &#8211; 8 Nov 2026 <tspan font-weight="500" fill="#475569">2 akhir pekan (Minggu)</tspan></text>
  </g>

  <!-- Row 2: Time -->
  <g transform="translate(68 422)">
    <circle cx="7" cy="8" r="7" fill="none" stroke="#64748B" stroke-width="1.6"/>
    <polyline points="7 4.5 7 8 9.5 9.5" fill="none" stroke="#64748B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="12.5" fill="#475569" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="500">Hadir <tspan font-weight="700" fill="#0F2537">06.30 WIB</tspan>, ujian mulai tepat <tspan font-weight="700" fill="#0F2537">07.00 WIB</tspan></text>
  </g>

  <!-- Row 3: Location -->
  <g transform="translate(68 450)">
    <path d="M7 1a5.2 5.2 0 0 0-5.2 5.2c0 3.7 5.2 8.8 5.2 8.8s5.2-5.1 5.2-8.8A5.2 5.2 0 0 0 7 1z" fill="none" stroke="#E6A826" stroke-width="1.6"/>
    <circle cx="7" cy="6.2" r="1.8" fill="#E6A826"/>
    <text x="26" y="12.5" fill="#0F2537" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">SMP Negeri 17 Kota Bandung<tspan font-weight="500" fill="#475569">, Arcamanik</tspan></text>
  </g>

  <!-- Bottom-right small italic note -->
  <text x="736" y="478" text-anchor="end" fill="#64748B" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-style="italic">*Dimohon hadir 30 menit sebelum ujian</text>
</svg>
